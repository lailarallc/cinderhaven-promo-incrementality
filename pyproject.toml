[project]
name = "cinderhaven-promo-incrementality"
version = "0.0.1"
description = "Trade-promotion incrementality tool: ROI Scorecard, Event Anatomy, and an estimate-vs-truth Accuracy view over the Cinderhaven promo-event spine"
readme = "README.md"
requires-python = ">=3.11"

# The pin is the SHA, not the tag. Annotated tags are mutable; a tag name
# would let the dependency change under a manifest that still reads as
# pinned. An accuracy number is meaningless without knowing which data
# generation it scored against — see DECISIONS.md.
#
# 820e193 = v0.6.2 (2026-09-02), a DOCS-ONLY release: citation fixes plus a
# representation-stable canonical_hash. Its three data hashes are byte-identical
# to v0.6.1's (1d76d12f / d2e6d58b / f650c132), so this re-pin needs NO re-score —
# every accuracy figure below still describes the data. It is the honest tip.
#
# bdb08c6 = v0.6.1, the tip after a TWO-EPOCH jump from v0.4.0 (6399990):
#   - v0.5.0 (calendar density): promoted volume ~1% -> ~25% of scan rows; the
#     event universe 131 -> 5,897 on the same 1,340,462-row scan spine.
#   - v0.6.0 (commercial dynamics): trade economics reworked; spend and every
#     per-event cost/ROI/giveaway figure move.
#   - v0.6.1: adversarial plausibility-audit fixes (docs-only, data-neutral vs
#     v0.6.0), so it is the honest tip to pin.
#
# THE ACCURACY ARTIFACT MOVES THIS TIME — unlike the v0.4.0 rate re-pin. Both
# epochs change unit truth (placement and volume, not just cost), so unit-level
# error and bias must be re-scored against the new truth. First time accuracy
# numbers move since launch, by design. Logged as one large re-run in DECISIONS.md,
# with Method 1 vectorized (equivalence-proven) so the ~5,900-event world scores in
# seconds, not ~9.5 min.
#
# Repo now lives under the lailarallc org (fleet migration). Resolve the pin with
# `git rev-parse v0.6.2^{commit}` — NOT `git rev-parse v0.6.2`, which returns the
# annotated tag object.
dependencies = [
    "cinderhaven-promo-response @ git+https://github.com/lailarallc/cinderhaven-promo-response@820e19358ed7e17e4b31ef0277f4ecbedce64262",
]

# Local iteration off a working tree is a hand-run command, never a manifest
# entry:  pip install -e ../cinderhaven-promo-response
# Putting that path here would make "pinned at v0.4.0" describe this machine
# rather than anything CI can reproduce.

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
