[project]
name = "cinderhaven-promo-incrementality"
version = "0.0.1"
description = "Trade-promotion incrementality tool: ROI Scorecard, Event Anatomy, and an estimate-vs-truth Accuracy view over the Cinderhaven promo-event spine"
readme = "README.md"
requires-python = ">=3.11"

# The pin is the SHA, not the tag. Annotated tags are mutable; a tag name
# would let the dependency change under a manifest that still reads as
# pinned. An accuracy number is meaningless without knowing which data
# generation it scored against — see DECISIONS.md.
#
# ff596fe = v0.7.0 (2026-11-04), the ASSORTMENT epoch: 9 launches and 8 exits
# (seed 42, measured from scan presence: 6 incumbents + 2 launches exit).
# Assortment volume is routed through baseline_units (launch cannibalization =
# sibling baseline step-down; exit = sibling step-up), never transfer_units.
# TRUTH-MOVING: unit truth AND the key universe move (promo_scan_delta 1,340,462 -> 1,293,126 rows; promo_events 5,897 -> 5,636).
# Full logged re-run in DECISIONS.md (2026-11-04), with SPEC §4.9.7's four
# pre-registered accuracy regimes scored. The upstream truth gate also tightened:
# it now forbids `response`/`generate` and `build_response`/`load_truth`.
#
# Prior pins: 820e193 = v0.6.2 (docs-only, no re-score); bdb08c6 = v0.6.1 (the
# two-epoch calendar-density + commercial-dynamics jump from v0.4.0, 6399990).
#
# Resolve the pin with `git rev-parse v0.7.0^{commit}` — NOT `git rev-parse
# v0.7.0`, which returns the annotated tag object.
dependencies = [
    "cinderhaven-promo-response @ git+https://github.com/lailarallc/cinderhaven-promo-response@ff596fe4599c3e6ab82451683bd13f36f22298a2",
]

# Local iteration off a working tree is a hand-run command, never a manifest
# entry:  pip install -e ../cinderhaven-promo-response
# Putting that path here would make "pinned at v0.4.0" describe this machine
# rather than anything CI can reproduce.

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
